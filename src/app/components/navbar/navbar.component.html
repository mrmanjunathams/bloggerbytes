<nav class="navbar navbar-expand-lg fixed-top" [class.solid]="solid()">
  <div class="container">
    <a class="navbar-brand" routerLink="/" (click)="close()">
      <span class="material-icons">edit_note</span>Bloggerbytes
    </a>
    <button class="navbar-toggler" type="button" aria-controls="mainNav"
      [attr.aria-expanded]="open()" aria-label="Toggle navigation" (click)="toggle()">
      <span class="material-icons">{{ open() ? 'close' : 'menu' }}</span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="open()" id="mainNav">
      <ul class="navbar-nav ms-auto align-items-lg-center">
        @for (link of links; track link.label) {
          <li class="nav-item">
            <a class="nav-link" [routerLink]="link.path" [fragment]="link.fragment" (click)="close()">{{ link.label }}</a>
          </li>
        }
        <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
          <a class="btn btn-brand btn-sm" [href]="signupHref">Start writing</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
